<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#222" font-weight="bold">5. The bottom corner at the free stile, in 3D</text><text x="20" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#555" font-weight="normal">Seen from the room side, from above. Rods drawn square; round is fine too.</text><polygon points="152.58,991 557.88,1225 501.59,1257.5 96.29,1023.5" fill="#8f979e" stroke="#3c4146" stroke-width="1" stroke-linejoin="round"/><polygon points="557.88,1238 557.88,1225 501.59,1257.5 501.59,1270.5" fill="#7b8288" stroke="#3c4146" stroke-width="1" stroke-linejoin="round"/><polygon points="96.29,1036.5 501.59,1270.5 501.59,1257.5 96.29,1023.5" fill="#676d72" stroke="#3c4146" stroke-width="1" stroke-linejoin="round"/><polygon points="151.46,235.05 556.76,469.05 529.74,484.65 124.44,250.65" fill="#2f5f9e" stroke="#1c3a63" stroke-width="1" stroke-linejoin="round"/><polygon points="556.76,500.25 556.76,469.05 529.74,484.65 529.74,515.85" fill="#285288" stroke="#1c3a63" stroke-width="1" stroke-linejoin="round"/><polygon points="124.44,281.85 529.74,515.85 529.74,484.65 124.44,250.65" fill="#224472" stroke="#1c3a63" stroke-width="1" stroke-linejoin="round"/><polygon points="178.48,167.45 205.5,183.05 178.48,198.65 151.46,183.05" fill="#2f5f9e" stroke="#1c3a63" stroke-width="1" stroke-linejoin="round"/><polygon points="205.5,1054.05 205.5,183.05 178.48,198.65 178.48,1069.65" fill="#285288" stroke="#1c3a63" stroke-width="1" stroke-linejoin="round"/><polygon points="151.46,1054.05 178.48,1069.65 178.48,198.65 151.46,183.05" fill="#224472" stroke="#1c3a63" stroke-width="1" stroke-linejoin="round"/><polygon points="557.88,354 569.14,360.5 456.56,425.5 445.3,419" fill="#e8772e" stroke="#9a4512" stroke-width="1" stroke-linejoin="round"/><polygon points="569.14,1244.5 569.14,360.5 456.56,425.5 456.56,1309.5" fill="#c86628" stroke="#9a4512" stroke-width="1" stroke-linejoin="round"/><polygon points="445.3,1303 456.56,1309.5 456.56,425.5 445.3,419" fill="#a75621" stroke="#9a4512" stroke-width="1" stroke-linejoin="round"/><line x1="582.85" y1="717" x2="512.85" y2="757" stroke="#222" stroke-width="0.9" marker-end="url(#arrowInk)"/><text x="586.85" y="721" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="normal">free stile 50 × 5</text><text x="586.85" y="738" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="normal">(next to the mullion)</text><line x1="526.56" y1="1213.5" x2="456.56" y2="1153.5" stroke="#222" stroke-width="0.9" marker-end="url(#arrowInk)"/><text x="530.56" y="1217.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="normal">its room-side edge sticks out</text><text x="530.56" y="1234.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="normal">25 past the bottom rail</text><line x1="236.42" y1="1197.5" x2="276.42" y2="1127.5" stroke="#222" stroke-width="0.9" marker-end="url(#arrowInk)"/><text x="232.42" y="1201.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222" font-weight="normal">bottom rail 25 × 5</text><line x1="411.86" y1="256.35" x2="351.86" y2="366.35" stroke="#222" stroke-width="0.9" marker-end="url(#arrowInk)"/><text x="415.86" y="260.35" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="normal">horizontal bar at 290,</text><text x="415.86" y="277.35" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="normal">front layer (glass side)</text><line x1="104.97" y1="514.85" x2="164.97" y2="554.85" stroke="#222" stroke-width="0.9" marker-end="url(#arrowInk)"/><text x="100.97" y="518.85" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222" font-weight="normal">vertical bar,</text><text x="100.97" y="535.85" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222" font-weight="normal">back layer</text><text x="40" y="1389.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#555" font-weight="normal">All bars are flush on the window side; only the free stile is deeper.</text>
