<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#222" font-weight="bold">4. Seen from above: a cut across the left-hand grille</text><text x="20" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#555" font-weight="normal">Looking down. The window glass is at the top, the room at the bottom.</text><rect x="62" y="116.7" width="960.5" height="37.4" fill="#dceaf6" stroke="#9bb7d0" stroke-width="1"/><text x="470" y="140.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">window: sash and glass</text><rect x="930.7" y="116.7" width="51" height="37.4" fill="#555" stroke="#222" stroke-width="1"/><text x="956.2" y="106.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">mullion</text><rect x="36.5" y="116.7" width="93.5" height="204" fill="url(#hatch)" stroke="#8a7f70" stroke-width="1"/><text x="41.6" y="387" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#555" font-weight="normal">wall</text><text x="41.6" y="403" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#555" font-weight="normal">(timber</text><text x="41.6" y="419" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#555" font-weight="normal">reveal)</text><rect x="138.5" y="200.85" width="773.5" height="20.4" fill="#9fbbe0" stroke="#1c3a63" stroke-width="1"/><circle cx="393.5" cy="231.45" r="10.2" fill="#2f5f9e" stroke="#1c3a63" stroke-width="1"/><circle cx="657" cy="231.45" r="10.2" fill="#2f5f9e" stroke="#1c3a63" stroke-width="1"/><rect x="130" y="200" width="8.5" height="42.5" fill="#8f979e" stroke="#3c4146" stroke-width="1.2"/><rect x="912" y="200" width="8.5" height="85" fill="#e8772e" stroke="#9a4512" stroke-width="1.2"/><line x1="130" y1="319" x2="920.5" y2="319" stroke="#555" stroke