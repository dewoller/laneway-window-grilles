<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" role="img" aria-label="The two bar sizes">
<defs>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#e4ddd2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8a7f70" stroke-width="1"/>
  </pattern>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#222" font-weight="bold">1. The two bar sizes, and which bar is which</text><text x="20" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#555" font-weight="normal">Every frame bar is 5 thick and stands on edge. Only the depth differs: 25 or 50.</text><line x1="60" y1="130" x2="640" y2="130" stroke="#1c3a63" stroke-width="1.2" stroke-dasharray="6 4"/><text x="60" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1c3a63" font-weight="bold">WINDOW SIDE (glass): every bar is flush on this line</text><rect x="140" y="130" width="30" height="150" fill="#8f979e" stroke="#3c4146" stroke-width="1.5"/><rect x="420" y="130" width="30" height="300" fill="#e8772e" stroke="#9a4512" stroke-width="1.5"/><line x1="126" y1="130" x2="126" y2="280" stroke="#555" stroke-width="0.8"/><line x1="123" y1="133" x2="129" y2="127" stroke="#555" stroke-width="1"/><line x1="120" y1="130" x2="132" y2="130" stroke="#555" stroke-width="0.6"/><line x1="123" y1="283" x2="129" y2="277" stroke="#555" stroke-width="1"/><line x1="120" y1="280" x2="132" y2="280" stroke="#555" stroke-width="0.6"/><text x="120" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#555" font-weight="normal">25</text><line x1="140" y1="302" x2="170" y2="302" stroke="#555" stroke-width="0.8"/><line x1="137" y1="305" x2="143" y2="299" stroke="#555" stroke-width="1"/><line x1="140" y1="296" x2="140" y2="308" stroke="#555" stroke-width="0.6"/><line x1="167" y1="305" x2="173" y2="299" stroke="#555" stroke-width="1"/><line x1="170" y1="296" x2="170" y2="308" stroke="#555" stroke-width="0.6"/><text x="155" y="297" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">5</text><line x1="406" y1="130" x2="406" y2="430" stroke="#555" stroke-width="0.8"/><line x1="403" y1="133" x2="409" y2="127" stroke="#555" stroke-width="1"/><line x1="400" y1="130" x2="412" y2="130" stroke="#555" stroke-width="0.6"/><line x1="403" y1="433" x2="409" y2="427" stroke="#555" stroke-width="1"/><line x1="400" y1="430" x2="412" y2="430" stroke="#555" stroke-width="0.6"/><text x="400" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#555" font-weight="normal">50</text><line x1="420" y1="452" x2="450" y2="452" stroke="#555" stroke-width="0.8"/><line x1="417" y1="455" x2="423" y2="449" stroke="#555" stroke-width="1"/><line x1="420" y1="446" x2="420" y2="458" stroke="#555" stroke-width="0.6"/><line x1="447" y1="455" x2="453" y2="449" stroke="#555" stroke-width="1"/><line x1="450" y1="446" x2="450" y2="458" stroke="#555" stroke-width="0.6"/><text x="435" y="447" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">5</text><text x="190" y="170" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">25 × 5</text><text x="190" y="188" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">wall-side stile</text><text x="190" y="206" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">top rail</text><text x="190" y="224" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">bottom rail</text><text x="190" y="242" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">(3 sides)</text><text x="470" y="170" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">50 × 5</text><text x="470" y="188" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">free stile ONLY</text><text x="470" y="206" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">(the side next to</text><text x="470" y="224" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="normal">the mullion)</text><text x="470" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a4512" font-weight="normal">Sticks 25 further</text><text x="470" y="308" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a4512" font-weight="normal">into the room.</text><line x1="80" y1="160" x2="80" y2="390" stroke="#222" stroke-width="1" marker-end="url(#arrowInk)"/><text x="72" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" transform="rotate(-90 72 280)">into the room</text><text x="70" y="500" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#555" font-weight="normal">Cross-sections, drawn 6 × full size.</text><rect x="700" y="90" width="167.4" height="421.56" fill="#dceaf6" stroke="none" stroke-width="1"/><line x1="755.8" y1="90" x2="755.8" y2="511.56" stroke="#2f5f9e" stroke-width="3"/><line x1="811.6" y1="90" x2="811.6" y2="511.56" stroke="#2f5f9e" stroke-width="3"/><line x1="700" y1="407.16" x2="867.4" y2="407.16" stroke="#2f5f9e" stroke-width="3"/><line x1="700" y1="300.96" x2="867.4" y2="300.96" stroke="#2f5f9e" stroke-width="3"/><line x1="700" y1="194.76" x2="867.4" y2="194.76" stroke="#2f5f9e" stroke-width="3"/><rect x="700" y="90" width="167.4" height="6" fill="#8f979e" stroke="#3c4146" stroke-width="1"/><rect x="700" y="505.56" width="167.4" height="6" fill="#8f979e" stroke="#3c4146" stroke-width="1"/><rect x="700" y="90" width="6" height="421.56" fill="#8f979e" stroke="#3c4146" stroke-width="1"/><rect x="861.4" y="90" width="6" height="421.56" fill="#e8772e" stroke="#9a4512" stroke-width="1"/><text x="692" y="300.78" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(-90 692 300.78)">wall side</text><text x="885.4" y="300.78" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(90 885.4 300.78)">mullion side</text><text x="680" y="541.56" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#555" font-weight="normal">Left-hand grille from inside.</text><text x="680" y="557.56" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#555" font-weight="normal">On the right-hand grille the</text><text x="680" y="573.56" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#555" font-weight="normal">orange 50 × 5 stile is on the left.</text>
</svg>
