<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" role="img" aria-label="Crossing detail: the horizontal and vertical rods touch, and a 4 by 24 mm roll pin passes through both perpendicular to the grid">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/>
  </marker>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="16" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Crossing detail: one roll pin through both rods, perpendicular to the grid</text>
<text x="20" y="31" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#555" font-weight="normal">left: looking along the horizontal rod. right: looking from the room. Scale 4 px = 1 mm</text>
<line x1="40" y1="92" x2="320" y2="92" stroke="#555" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="40" y="88" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#555" font-weight="normal">frame window-side face, Z 0</text>
<rect x="40" y="172" width="280" height="48" fill="#9aa0a6" stroke="#3c4146" stroke-width="1"/>
<text x="204" y="210" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#222" font-weight="normal">vertical rod, Z 26, runs along Y</text>
<circle cx="180" cy="148" r="24" fill="#6c7378" stroke="#3c4146" stroke-width="1"/>
<text x="210" y="142" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#222" font-weight="normal">horizontal rod, Z 14,</text>
<text x="210" y="154" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#222" font-weight="normal">runs toward you</text>
<rect x="172" y="124" width="16" height="96" fill="#c8102e" stroke="#fff" stroke-width="0.8"/>
<text x="48" y="260" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#c8102e" font-weight="normal">pin 4 × 24, flush both ends, drilled from the room side</text>
<line x1="312" y1="92" x2="330" y2="92" stroke="#555" stroke-width="0.6"/><line x1="204" y1="148" x2="330" y2="148" stroke="#555" stroke-width="0.6"/><line x1="326" y1="92" x2="326" y2="148" stroke="#555" stroke-width="0.7"/><line x1="323" y1="95" x2="329" y2="89" stroke="#555" stroke-width="0.9"/><line x1="323" y1="151" x2="329" y2="145" stroke="#555" stroke-width="0.9"/><text x="323" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(-90 323 120)">14</text>
<line x1="342" y1="92" x2="342" y2="196" stroke="#555" stroke-width="0.7"/><line x1="339" y1="95" x2="345" y2="89" stroke="#555" stroke-width="0.9"/><line x1="339" y1="199" x2="345" y2="193" stroke="#555" stroke-width="0.9"/><text x="339" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(-90 339 144)">26</text>
<line x1="172" y1="124" x2="54" y2="124" stroke="#555" stroke-width="0.6"/><line x1="172" y1="220" x2="54" y2="220" stroke="#555" stroke-width="0.6"/><line x1="58" y1="124" x2="58" y2="220" stroke="#555" stroke-width="0.7"/><line x1="55" y1="127" x2="61" y2="121" stroke="#555" stroke-width="0.9"/><line x1="55" y1="223" x2="61" y2="217" stroke="#555" stroke-width="0.9"/><text x="55" y="172" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(-90 55 172)">24</text>
<text x="48" y="108" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#555" font-weight="normal">glass side ↑</text>
<text x="48" y="230" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#555" font-weight="normal">room side ↓</text>
<rect x="420" y="176" width="280" height="48" fill="#9aa0a6" stroke="#3c4146" stroke-width="1"/>
<text x="696" y="236" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" fill="#222" font-weight="normal">horizontal, behind</text>
<rect x="536" y="60" width="48" height="280" fill="#b4b9be" stroke="#3c4146" stroke-width="1"/>
<text x="588" y="72" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#222" font-weight="normal">vertical, nearer the room</text>
<circle cx="560" cy="200" r="8" fill="#c8102e" stroke="#fff" stroke-width="0.8"/>
<line x1="568" y1="200" x2="634" y2="160" stroke="#c8102e" stroke-width="0.6"/>
<text x="636" y="158" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#c8102e" font-weight="normal">pin end, 4 mm</text>
<text x="420" y="358" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#555" font-weight="normal">six of these per grille, at X 155 and 310 by Y 290, 585 and 880</text>
</svg>
