<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#222" font-weight="bold">2. Where the two grilles go</text><text x="20" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#555" font-weight="normal">Seen from inside the room. The grilles sit in the window opening, in front of the glass.</text><rect x="30" y="92" width="60" height="687.9" fill="url(#hatch)" stroke="#8a7f70" stroke-width="1"/><rect x="879.5" y="92" width="60" height="687.9" fill="url(#hatch)" stroke="#8a7f70" stroke-width="1"/><text x="60" y="829.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">wall</text><text x="909.5" y="829.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">wall</text><rect x="345.75" y="92" width="14" height="687.9" fill="#555" stroke="#222" stroke-width="1"/><rect x="609.75" y="92" width="14" height="687.9" fill="#555" stroke="#222" stroke-width="1"/><rect x="359.75" y="92" width="250" height="687.9" fill="#dceaf6" stroke="#9bb7d0" stroke-width="1"/><text x="484.75" y="362" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">rest of the window</text><text x="484.75" y="379" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">not part of this job</text><text x="352.75" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">mullion</text><text x="616.75" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">mullion</text><rect x="90" y="115.85" width="255.75" height="644.05" fill="#dceaf6" stroke="none" stroke-width="1"/><rect x="90" y="115.85" width="255.75" height="7" fill="#8f979e" stroke="#3c4146" stroke-width="