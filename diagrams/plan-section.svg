<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 266" width="640" height="266" role="img" aria-label="Plan section through the grille showing the two rod layers inside the 42 mm member depth, the 27 mm gap to the sash, the fixing screw and the room-side stop bead">
