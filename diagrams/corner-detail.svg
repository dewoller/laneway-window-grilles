<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 521" width="775" height="521" role="img" aria-label="Free-stile top corner: the rail runs over the stile with two screws into its end grain; the vertical rod passes through the rail and ends flush against the reveal head; the top opener insert sits 9 mm below the rail">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/>
  </marker>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="16" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Free-stile top corner, viewed from the room</text>
<text x="20" y="31" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#555" font-weight="normal">rail runs full width over the stile; vertical rod ends flush against the reveal head. Scale 3 px = 1 mm</text>
<rect x="70" y="50" width="615" height="87" fill="#e6cfa3" stroke="#8a6a3a" stroke-width="1"/>
<line x1="82" y1="53" x2="106" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="124" y1="53" x2="148" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="166" y1="53" x2="190" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="208" y1="53" x2="232" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="250" y1="53" x2="274" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="292" y1="53" x2="316" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="334" y1="53" x2="358" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="376" y1="53" x2="400" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="418" y1="53" x2="442" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="460" y1="53" x2="484" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="502" y1="53" x2="526" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="544" y1="53" x2="568" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="586" y1="53" x2="610" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="628" y1="53" x2="652" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<line x1="670" y1="53" x2="694" y2="134" stroke="#8a6a3a" stroke-width="0.4"/>
<text x="88" y="129" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#222" font-weight="normal">reveal head</text>
<line x1="595" y1="137" x2="595" y2="485" stroke="#555" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="609" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(-90 609 350)">mullion side, open</text>
<rect x="70" y="137" width="525" height="36" fill="#e6cfa3" stroke="#8a6a3a" stroke-width="1"/>
<rect x="538" y="173" width="57" height="312" fill="#e6cfa3" stroke="#8a6a3a" stroke-width="1"/>
<text x="190" y="158.5" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#222" font-weight="normal">top rail 42 × 12, full width</text>
<text x="532" y="365" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#222" font-weight="normal" transform="rotate(-90 532 365)">free stile 42 × 19, between the rails</text>
<rect x="112" y="173" width="36" height="312" fill="#9aa0a6" stroke="#3c4146" stroke-width="1"/>
<rect x="112" y="137" width="36" height="36" fill="none" stroke="#3c4146" stroke-width="0.7" stroke-dasharray="3 2"/>
<text x="154" y="425" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#222" font-weight="normal">vertical rod, through the rail, cut flush</text>
<text x="154" y="455" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#555" font-weight="normal">captive: the head of the reveal is right there</text>
<line x1="553" y1="137" x2="553" y2="257" stroke="#222" stroke-width="1.4" stroke-dasharray="3 2"/>
<line x1="548" y1="137" x2="558" y2="137" stroke="#222" stroke-width="2"/>
<line x1="580" y1="137" x2="580" y2="257" stroke="#222" stroke-width="1.4" stroke-dasharray="3 2"/>
<line x1="575" y1="137" x2="585" y2="137" stroke="#222" stroke-width="2"/>
<text x="528" y="236" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" fill="#222" font-weight="normal">2 × 8 g × 40 screws through the rail into the stile end grain, glued.</text>
<text x="528" y="266" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" fill="#555" font-weight="normal">Opener load on the stile is toward the room, so they work in shear.</text>
<text x="528" y="314" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" fill="#555" font-weight="normal">No bracket here: the opener foot plate at 1150 owns this face,</text>
<text x="528" y="344" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" fill="#555" font-weight="normal">and the rail is screwed to the reveal head 77 mm from this end.</text>
<polygon points="538.5,405 538.5,415 543.5,410" fill="#c8102e"/>
<text x="528" y="413.5" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" fill="#c8102e" font-weight="normal">M5 insert, 1080</text>
<polygon points="538.5,195 538.5,205 543.5,200" fill="#c8102e"/>
<text x="528" y="203.5" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" fill="#c8102e" font-weight="normal">M5 insert, 1150</text>
<line x1="595" y1="173" x2="629" y2="173" stroke="#555" stroke-width="0.6"/><line x1="595" y1="200" x2="629" y2="200" stroke="#555" stroke-width="0.6"/><line x1="625" y1="173" x2="625" y2="200" stroke="#555" stroke-width="0.7"/><line x1="622" y1="176" x2="628" y2="170" stroke="#555" stroke-width="0.9"/><line x1="622" y1="203" x2="628" y2="197" stroke="#555" stroke-width="0.9"/><text x="622" y="186.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(-90 622 186.5)">9</text>
<text x="631" y="182" font-family="Helvetica, Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(-90 631 182)">plate must fit</text>
<line x1="538" y1="485" x2="538" y2="503" stroke="#555" stroke-width="0.6"/><line x1="595" y1="485" x2="595" y2="503" stroke="#555" stroke-width="0.6"/><line x1="538" y1="499" x2="595" y2="499" stroke="#555" stroke-width="0.7"/><line x1="535" y1="502" x2="541" y2="496" stroke="#555" stroke-width="0.9"/><line x1="592" y1="502" x2="598" y2="496" stroke="#555" stroke-width="0.9"/><text x="566.5" y="496" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555" font-weight="normal">19</text>
<line x1="70" y1="137" x2="56" y2="137" stroke="#555" stroke-width="0.6"/><line x1="70" y1="173" x2="56" y2="173" stroke="#555" stroke-width="0.6"/><line x1="60" y1="137" x2="60" y2="173" stroke="#555" stroke-width="0.7"/><line x1="57" y1="140" x2="63" y2="134" stroke="#555" stroke-width="0.9"/><line x1="57" y1="176" x2="63" y2="170" stroke="#555" stroke-width="0.9"/><text x="57" y="155" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555" font-weight="normal" transform="rotate(-90 57 155)">12</text>
</svg>
